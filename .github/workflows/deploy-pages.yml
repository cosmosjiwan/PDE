name: Deploy to GitHub Pages

# Publishes the static site to GitHub Pages on every push to the default
# branch. `configure-pages` with enablement:true turns Pages on automatically,
# so no manual Settings step is needed (requires the repo's plan to allow
# Pages — public repos always do; private repos need Pro/Team/Enterprise).

on:
  push:
    branches: ["claude/vibrant-fermat-8p3czu"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
