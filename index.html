<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#e7ecf3" />
  <title>PDE Playground — 실시간 편미분방정식 시각화</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css"
  />
  <link rel="stylesheet" href="css/style.css?v=20260626" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <header>
        <h1>PDE Playground</h1>
        <p class="subtitle">GPU 기반 실시간 편미분방정식 솔버</p>
      </header>

      <section class="panel">
        <label class="field-label" for="equation-select">방정식</label>
        <select id="equation-select" aria-label="방정식 선택"></select>
        <p id="equation-desc" class="desc"></p>
        <div id="equation-formula" class="formula"></div>
      </section>

      <section class="panel" id="params-panel">
        <label class="field-label">파라미터</label>
        <div id="params"></div>
      </section>

      <section class="panel">
        <label class="field-label">시각화</label>
        <div class="control-row">
          <span>컬러맵</span>
          <select id="cmap-select" aria-label="컬러맵 선택">
            <option value="0">Coolwarm</option>
            <option value="1">Fire</option>
            <option value="2">Spectral</option>
            <option value="3">Ocean</option>
            <option value="4">Grayscale</option>
          </select>
        </div>
        <div class="control-row slider">
          <span>대비 (gain)</span>
          <input type="range" id="gain" min="0.1" max="6" step="0.05" value="1.4" aria-label="대비 (gain)" />
          <output id="gain-val"></output>
        </div>
        <div class="control-row">
          <span>해상도</span>
          <select id="grid-select" aria-label="격자 해상도">
            <option value="128">128 × 128</option>
            <option value="256" selected>256 × 256</option>
            <option value="512">512 × 512</option>
          </select>
        </div>
        <div class="control-row slider">
          <span>속도 (steps/frame)</span>
          <input type="range" id="substeps" min="1" max="20" step="1" value="4" aria-label="시뮬레이션 속도 (프레임당 스텝)" />
          <output id="substeps-val"></output>
        </div>
        <div class="control-row slider">
          <span>붓 크기</span>
          <input type="range" id="brush" min="0.005" max="0.12" step="0.005" value="0.03" aria-label="붓 크기" />
          <output id="brush-val"></output>
        </div>
      </section>

      <section class="panel buttons">
        <button id="btn-play">⏸ 일시정지</button>
        <button id="btn-clear">🧹 초기화</button>
      </section>

      <footer>
        <p class="hint">캔버스를 <strong>클릭/드래그</strong>하면 그 자리에 교란을 줍니다. 모바일에서는 터치하세요.</p>
        <p class="status" id="status"></p>
      </footer>
    </aside>

    <main id="canvas-wrap">
      <canvas id="gl" role="img" aria-label="편미분방정식 시뮬레이션 화면. 클릭 또는 드래그하여 교란을 줍니다."></canvas>
      <div id="overlay-msg" class="overlay-msg hidden"></div>
    </main>
  </div>

  <script type="module" src="js/main.js?v=20260626"></script>
</body>
</html>
